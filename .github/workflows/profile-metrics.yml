name: Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: ["main", "master"]
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local GitHub stats and trophies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_cards.py
      - name: Commit refreshed profile cards
        run: |
          git config user.name "angel-noori-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-metrics.svg assets/github-trophies.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile metrics"
          git push
